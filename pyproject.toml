[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[project]
name = "ie221-bikestore"
version = "0.1.0"
description = "BikeStore B2B Sales Platform — IE221"
requires-python = ">=3.11"

dependencies = [
    # Core
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    # OAuth2 / Social Auth
    "django-allauth[mfa,socialaccount]>=65.0",
    "dj-rest-auth[with_social]>=7.0",
    "requests>=2.31",
    # Config
    "python-decouple>=3.8",
    # Database
    "psycopg2-binary>=2.9",
    # Cache / Broker
    "redis>=5.0",
    "celery[redis]>=5.4",
    "flower>=2.0",
    # API helpers
    "drf-spectacular>=0.27",
    "drf-nested-routers>=0.94",
    "django-cors-headers>=4.0",
    "django-filter>=24.0",
    # Domain / Models
    "django-mptt>=0.16",
    # Async / Search / Cache
    "django-elasticsearch-dsl>=8.0",
    "django-cache-memoize>=0.2",
    # Security & Audit
    "django-ratelimit>=4.1",
    "django-pghistory>=3.0",
    # Observability
    "structlog>=24.0",
    "sentry-sdk[django]>=2.0",
    "django-prometheus>=2.3",
    "django-silk>=5.1",
    # Production Server
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "pre-commit>=3.7",
    "ipython>=8.0",
    "responses>=0.25",       # mock HTTP for OAuth2 tests
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (let formatter handle it)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "F401"]
"*/tests/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
