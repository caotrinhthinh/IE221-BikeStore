services:
    web:
        build:
            context: .
            target: runtime
        command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
        volumes:
            - .:/app
        ports:
            - '127.0.0.1:${WEB_PORT:?WEB_PORT is required}:8000'
        env_file:
            - .env
        environment:
            DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:?DJANGO_SETTINGS_MODULE is required}
            RUNNING_IN_DOCKER: 'true'
            DB_HOST: ${DOCKER_DB_HOST:?DOCKER_DB_HOST is required}
            DB_PORT: ${DOCKER_DB_PORT:?DOCKER_DB_PORT is required}
            REDIS_URL: ${DOCKER_REDIS_URL:?DOCKER_REDIS_URL is required}
            CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL:?DOCKER_CELERY_BROKER_URL is required}
            CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND:?DOCKER_CELERY_RESULT_BACKEND is required}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        ports:
            - '127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
            POSTGRES_USER: ${DB_USER:?DB_USER is required}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        ports:
            - '127.0.0.1:${REDIS_HOST_PORT:?REDIS_HOST_PORT is required}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    celery_worker:
        build:
            context: .
            target: runtime
        command: celery -A config worker --loglevel=info --concurrency=2
        volumes:
            - .:/app
        env_file:
            - .env
        environment:
            DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:?DJANGO_SETTINGS_MODULE is required}
            RUNNING_IN_DOCKER: 'true'
            DB_HOST: ${DOCKER_DB_HOST:?DOCKER_DB_HOST is required}
            DB_PORT: ${DOCKER_DB_PORT:?DOCKER_DB_PORT is required}
            REDIS_URL: ${DOCKER_REDIS_URL:?DOCKER_REDIS_URL is required}
            CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL:?DOCKER_CELERY_BROKER_URL is required}
            CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND:?DOCKER_CELERY_RESULT_BACKEND is required}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'celery', '-A', 'config', 'inspect', 'ping', '--timeout=5']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
