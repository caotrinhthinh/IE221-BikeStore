<!DOCTYPE html>
<html>
  <head>
    <title>{{ title|default:"API Docs" }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'drf_spectacular_sidecar/swagger-ui-dist/swagger-ui.css' %}" />
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *:after, *:before { box-sizing: inherit; }
      body { background: #fafafa; margin: 0; }
    </style>
  </head>
  <body>
    <div id="swagger-ui" data-schema-url="{{ schema_url|default:'/api/schema/?format=json' }}"></div>
    {# All scripts are external files — required for CSP script-src 'self' (no unsafe-inline) #}
    <script src="{% static 'drf_spectacular_sidecar/swagger-ui-dist/swagger-ui-bundle.js' %}"></script>
    <script src="{% static 'drf_spectacular_sidecar/swagger-ui-dist/swagger-ui-standalone-preset.js' %}"></script>
    <script src="{% static 'swagger_ui_init.js' %}"></script>
  </body>
</html>
